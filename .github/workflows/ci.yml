name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Typecheck, build, and test. Gates every PR.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version: uses the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Docker runtime (node:22-alpine).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # Build the Docker image on every PR (no push); publish to GHCR only on main.
  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (PRs)
        if: github.event_name == 'pull_request'
        run: docker build -t understudy:ci .

      - name: Build and publish a Docker image for ${{ github.repository }}
        if: github.event_name == 'push'
        uses: macbre/push-to-ghcr@v14
        with:
          image_name: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
